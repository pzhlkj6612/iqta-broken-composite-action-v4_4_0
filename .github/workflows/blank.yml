name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ${{ github.action_path }}
      - name: List files
        run: |
          set -x
          for sha in \
            48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 \
            bcb88e3bed2e992f5f9e24c0f9e364a231d278eb;
          do
            if [[ ! -d /home/runner/work/_actions/jurplel/install-qt-action/$sha ]]; then
              break
            fi
            pushd /home/runner/work/_actions/jurplel/install-qt-action/$sha
            # find .
            md5sum ./action/action.yml
            grep -rnw -A 5 'py7zrversion:' ./action/action.yml
          done
          popd

      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb  # v4.4.0
        if: false
